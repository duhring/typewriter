<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map my thinking</title>
<style>
body{margin:0;background:#f5f3ed;color:#24362e;font:16px system-ui}header{padding:18px 24px;border-bottom:1px solid #ccd3cb}h1{margin:0 0 8px;font-size:24px}button{padding:8px 12px;margin:4px;border:1px solid #8c9e91;background:white;border-radius:6px;cursor:pointer}button:focus-visible,g:focus-visible{outline:3px solid #da781d}#status{margin:6px 0;color:#655338}#viewport{height:70vh;overflow:hidden;touch-action:none}svg{width:100%;height:100%}.node{cursor:pointer}.node rect{fill:#fff;stroke:#50765d;stroke-width:2}.suggested rect{fill:#fff6df;stroke:#9c7738;stroke-dasharray:6 3}text{font-family:system-ui;font-size:14px;fill:#24362e}.edge{fill:none;stroke:#9cb1a1;stroke-width:2}#detail{padding:16px 24px;white-space:pre-wrap}
</style>
<header><h1 id="title"></h1><p id="status"></p><button id="fit">Fit map</button><button id="expand">Expand all</button><button id="svg-export">Export SVG</button><button id="png-export">Export PNG</button><span id="export-status" role="status"></span><p>Click a branch to collapse it. Scroll to zoom; drag to pan. Tab and Enter also open branches.</p></header>
<main><div id="viewport"><svg id="map" aria-label="Mindmap"><g id="scene"></g></svg></div><div id="detail" role="status">Select a branch to see its source.</div></main>
<script id="map-data" type="application/json">MINDMAP_DATA</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('map-data').textContent), root=data.root;
const svg=document.getElementById('map'),scene=document.getElementById('scene'),collapsed=new Set();
const NS='http:'+'//www.w3.org/2000/svg';let scale=1,dx=20,dy=20,width=800,height=500,drag=null;
document.getElementById('title').textContent=root.label;
const draft=data.status.review!=='current';
const banner=(draft?'Draft — '+(data.status.review==='stale'?'review stale':'not reviewed'):'Owner-reviewed map')+' · version '+data.version+(data.status.needs_refresh?' · needs refresh':'');
document.getElementById('status').textContent=banner;
function el(name,attrs={}){const e=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e;}
function transform(){scene.setAttribute('transform',`translate(${dx} ${dy}) scale(${scale})`);}
function layout(){scene.replaceChildren();let row=0;const placed=[];function walk(n,depth,parent){const p={n,x:depth*300,y:row++*120,parent};placed.push(p);if(!collapsed.has(n.id))n.children.forEach(c=>walk(c,depth+1,p));}walk(root,0,null);width=Math.max(...placed.map(p=>p.x))+300;height=Math.max(150,row*120);
for(const p of placed){if(p.parent){scene.append(el('path',{class:'edge',d:`M ${p.parent.x+255} ${p.parent.y+40} C ${p.x-25} ${p.parent.y+40},${p.x-25} ${p.y+40},${p.x} ${p.y+40}`}));}}
for(const p of placed){const n=p.n,g=el('g',{class:'node '+(n.by==='suggested'?'suggested':''),transform:`translate(${p.x} ${p.y})`,tabindex:'0',role:'button','aria-label':n.label,'aria-expanded':String(!collapsed.has(n.id)),'data-node-id':n.id});g.append(el('rect',{width:255,height:96,rx:12}));const words=n.label.split(/\s+/),lines=[];let line='';for(const word of words){if((line+' '+word).length>29&&line){lines.push(line);line=word;}else line+=(line?' ':'')+word;}if(line)lines.push(line);lines.slice(0,3).forEach((s,i)=>{const t=el('text',{x:12,y:24+i*18});t.textContent=s+(i===2&&lines.length>3?'…':'');g.append(t);});const tag=el('text',{x:12,y:84});tag.textContent=(n.by==='suggested'?'suggested':'interview')+(n.edited?' · edited':'')+(data.status.stale_src.includes(n.id)?' · outdated source':'')+(n.children.length?' · '+(collapsed.has(n.id)?'+':'−'):'');g.append(tag);const title=el('title');title.textContent=n.label+'\n'+(n.src||n.basis||'');g.append(title);function choose(){document.getElementById('detail').textContent=n.label+'\n'+(n.src||n.basis||'')+(n.edited?'\n'+n.edited:'');if(n.children.length){collapsed.has(n.id)?collapsed.delete(n.id):collapsed.add(n.id);layout();scene.querySelectorAll('[data-node-id]').forEach(e=>{if(e.getAttribute('data-node-id')===n.id)e.focus();});}}g.addEventListener('click',choose);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}});scene.append(g);}transform();}
function fit(){scale=Math.min(svg.clientWidth/(width+40),svg.clientHeight/(height+40),1);dx=20;dy=20;transform();}
svg.addEventListener('wheel',e=>{e.preventDefault();const rect=svg.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,old=scale;scale=Math.max(.1,Math.min(4,scale*Math.exp(-e.deltaY*.001)));dx=x-(x-dx)*scale/old;dy=y-(y-dy)*scale/old;transform();},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.target===svg||e.target.classList.contains('edge')){drag={x:e.clientX,y:e.clientY,dx,dy};svg.setPointerCapture(e.pointerId);}});svg.addEventListener('pointermove',e=>{if(drag){dx=drag.dx+e.clientX-drag.x;dy=drag.dy+e.clientY-drag.y;transform();}});svg.addEventListener('pointerup',()=>drag=null);
document.getElementById('fit').addEventListener('click',fit);document.getElementById('expand').addEventListener('click',()=>{collapsed.clear();layout();fit();});
function exportedSVG(){const out=svg.cloneNode(true);out.setAttribute('xmlns',NS);out.setAttribute('width',width+40);out.setAttribute('height',height+80);out.setAttribute('viewBox',`0 0 ${width+40} ${height+80}`);out.querySelector('#scene').setAttribute('transform','translate(20 60)');const style=el('style');style.textContent=document.querySelector('style').textContent;out.prepend(style);const t=el('text',{x:20,y:25});t.textContent=banner;out.append(t);return new XMLSerializer().serializeToString(out);}
function save(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('export-status').textContent='Saved '+name;}
document.getElementById('svg-export').addEventListener('click',()=>save(new Blob([exportedSVG()],{type:'image/svg+xml'}),'mindmap.svg'));
document.getElementById('png-export').addEventListener('click',()=>{const img=new Image(),url=URL.createObjectURL(new Blob([exportedSVG()],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas'),ratio=Math.min(2,8192/Math.max(width+40,height+80));c.width=Math.ceil((width+40)*ratio);c.height=Math.ceil((height+80)*ratio);const ctx=c.getContext('2d');ctx.scale(ratio,ratio);ctx.fillStyle='#f5f3ed';ctx.fillRect(0,0,width+40,height+80);ctx.drawImage(img,0,0);URL.revokeObjectURL(url);c.toBlob(b=>{if(b)save(b,'mindmap.png');},'image/png');};img.onerror=()=>{URL.revokeObjectURL(url);document.getElementById('export-status').textContent='Export failed';};img.src=url;});
layout();fit();window.addEventListener('resize',fit);
</script></html>
